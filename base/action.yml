name: 'Setup IOG libraries'
description: 'Installs a set of libraries our projects usually depend on'
inputs:
  use-sodium-vrf:
    description: Use libsodium with VRF extension
    type: boolean
    default: true
  url-prefix:
    description: Location to pull the pkgs from
    type: string
    default: https://github.com/input-output-hk/iohk-nix/releases/latest/download

runs:
  using: "composite"
  steps:
    - name: "[darwin] Install library dependencies"
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install --overwrite pkg-config openssl@3.0

        mkdir __prep__
        pushd __prep__
          curl -fsSL ${{ inputs.url-prefix }}/$(uname -m)-macos.${{ inputs.use-sodium-vrf == 'true' && 'libsodium-vrf' || 'libsodium' }}.pkg > libsodium.pkg
          curl -fsSL ${{ inputs.url-prefix }}/$(uname -m)-macos.libsecp256k1.pkg > libsecp256k1.pkg
          curl -fsSL ${{ inputs.url-prefix }}/$(uname -m)-macos.libblst.pkg      > libblst.pkg
          for pkg in *.pkg; do
            sudo installer -pkg $pkg -target /
          done
        popd
        rm -fR __prep__

    - name: "[darwin] update environment variables"
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "LD_LIBRARY_PATH=/usr/local/lib" >> $GITHUB_ENV
        # Note: we add both /opt/homebrew/opt and /usr/local/opt for homebrews openssl@3.0, this is
        #       because different GitHub Runner at different revisions have different homebrew opt layouts.
        echo "PKG_CONFIG_PATH=/usr/local/opt/cardano/lib/pkgconfig:/opt/homebrew/opt/openssl@3.0/lib/pkgconfig:/usr/local/opt/openssl@3.0/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:$PKG_CONFIG_PATH" \
          >> $GITHUB_ENV

    # We use the MSYS2 CLANG64 environment: like GHC's Windows toolchain (since GHC 9.4) it is
    # clang-based and links against UCRT. Libraries from the MINGW64 environment link against
    # msvcrt.dll instead, so a process would load two C runtimes, each with its own heap, errno
    # and stdio state.
    #
    # On pkg-config: the MSYS `pkgconf` (`/usr/bin`, pulled in by `base-devel`) can't interpret a
    # semicolon-separated `PKG_CONFIG_PATH`. `mingw-w64-clang-x86_64-pkgconf` (the only pkg-config
    # in CLANG64) handles it, and also answers queries for multiple modversions as cabal makes them.
    # We still set `PKG_CONFIG_ALLOW_SYSTEM_(CFLAGS|LIBS)` so `C:/msys64/clang64/{include,lib}` are
    # never stripped from the returned flags.
    - name: "[windows] Install library dependencies"
      if: runner.os == 'Windows'
      shell: C:/msys64/usr/bin/bash.exe -e '{0}'
      env:
        MSYSTEM: CLANG64
        # do not ever change to $HOME by yourself.
        CHERE_INVOKING: 1
        # do we want to inherit the path?
        # MSYS2_PATH_TYPE: inherit
      run: |
        mv /c/Strawberry/perl/bin/pkg-config     /c/Strawberry/perl/bin/perl-pkg-config
        mv /c/Strawberry/perl/bin/pkg-config.bat /c/Strawberry/perl/bin/perl-pkg-config.bat

        /usr/bin/pacman --noconfirm -S mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-openssl

        echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" >> $GITHUB_ENV
        echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"   >> $GITHUB_ENV

        mkdir __prep__
        pushd __prep__
          curl -fsSL ${{ inputs.url-prefix }}/clang64.${{ inputs.use-sodium-vrf == 'true' && 'libsodium-vrf' || 'libsodium' }}.pkg.tar.zstd > libsodium.pkg.tar.zstd
          curl -fsSL ${{ inputs.url-prefix }}/clang64.libsecp256k1.pkg.tar.zstd > libsecp256k1.pkg.tar.zstd
          curl -fsSL ${{ inputs.url-prefix }}/clang64.libblst.pkg.tar.zstd      > libblst.pkg.tar.zstd
          for pkg in *.zstd; do
            /usr/bin/pacman --noconfirm -U $pkg
          done
        popd
        rm -fR __prep__

    # MSYS will inherit the PATH from PWSH, but not the other way round, and setting the path
    # to "PATH=...:$PATH" in bash results in all the paths starting with `/c/` instead of `C:\` which
    # makes some actions (like `actions/checkout`) fail as it cannot find executables.
    - name: "[windows] update environment variables"
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "PATH=C:\\msys64\\clang64\\opt\\cardano\\bin;C:\\msys64\\clang64\\bin;{0}" -f $env:PATH  >> $env:GITHUB_ENV
        "PKG_CONFIG_PATH=C:\\msys64\\clang64\\opt\\cardano\\lib\\pkgconfig;C:\\msys64\\clang64\\lib\\pkgconfig;C:\\msys64\\clang64\\share\\pkgconfig;C:\\msys64\\usr\\lib\\pkgconfig;C:\\msys64\\usr\\share\\pkgconfig;{0}" -f $env:PKG_CONFIG_PATH >> $env:GITHUB_ENV
        # Git Bash (`shell: bash`) prepends its own mingw64\bin, which ships OpenSSL, zlib, ...,
        # to PATH. Bash sources BASH_ENV after that, so our libraries come first again.
        $bashEnv = "$env:RUNNER_TEMP/iog-base-env.sh" -replace '\\', '/'
        [IO.File]::WriteAllText($bashEnv, 'export PATH="/c/msys64/clang64/opt/cardano/bin:/c/msys64/clang64/bin:$PATH"' + "`n")
        "BASH_ENV=$bashEnv" >> $env:GITHUB_ENV

    # Git for Windows refuses to create paths longer than 260 characters unless
    # core.longpaths is set. The repositories themselves stay under the limit, but
    # git operations that clone other repos on the runner can exceed it: cabal
    # fetches source-repository-packages into dist-newstyle/src/<name>-<hash>/,
    # whose prefix alone is ~120 characters.
    - name: "[windows] Enable long file paths for Git"
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --system core.longpaths true

    - name: "[linux] Install library dependencies"
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get -y install libsystemd-dev liburing-dev

        mkdir __prep__
        pushd __prep__
          curl -fsSL ${{ inputs.url-prefix }}/debian.${{ inputs.use-sodium-vrf == 'true' && 'libsodium-vrf' || 'libsodium' }}.deb > libsodium.deb
          curl -fsSL ${{ inputs.url-prefix }}/debian.libsecp256k1.deb > libsecp256k1.deb
          curl -fsSL ${{ inputs.url-prefix }}/debian.libblst.deb      > libblst.deb
          for pkg in *.deb; do
            sudo dpkg -i $pkg
          done
        popd
        rm -fR __prep__

    - name: "[linux] update environment variables"
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=/usr/local/opt/cardano/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/usr/local/opt/cardano/lib:$LD_LIBRARY_PATH"           >> $GITHUB_ENV
